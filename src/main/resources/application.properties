spring.application.name=lotamenos-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.fetch_size=500

spring.jackson.time-zone=America/Sao_Paulo

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=false
info.app.nome=LotaMenos API
info.app.descricao=Previsao de lotacao do metro de Sao Paulo (Linha 3-Vermelha)
info.app.versao=1.0.0
management.info.env.enabled=true
