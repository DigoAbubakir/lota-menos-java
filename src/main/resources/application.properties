# ===================================================================
# LotaMenos API - perfil PADRAO (Oracle FIAP) - usado no Render
# Credenciais SOMENTE por variaveis de ambiente: DB_URL, DB_USER, DB_PASSWORD
# ===================================================================
spring.application.name=lotamenos-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita conexoes por usuario
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1200000

# O schema e criado pelos scripts database/01_ddl.sql e 02_dml.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Dialeto fixo + sem leitura de metadados no boot: a API sobe mesmo se o Oracle estiver indisponivel
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Fuso horario (o Render roda em UTC)
spring.jackson.time-zone=America/Sao_Paulo

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Respeita o HTTPS do proxy do Render (evita "mixed content" no Try it out)
server.forward-headers-strategy=framework

# Actuator: so health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Health check de liveness (nao derruba o deploy se o Oracle da FIAP oscilar)
management.health.db.enabled=false
info.app.nome=LotaMenos API
info.app.descricao=Previsao de lotacao do metro de Sao Paulo (Linha 3-Vermelha)
info.app.versao=1.0.0
management.info.env.enabled=true
