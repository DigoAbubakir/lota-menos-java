# ===================================================================
# Perfil DEV - H2 em memoria (modo Oracle), sem precisar do Oracle da FIAP
# Rodar com: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================================
spring.datasource.url=jdbc:h2:mem:lotamenos;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
